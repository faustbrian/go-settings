schema_version: 1
tool_version: v1.4.0
tool_checksums_sha256: ba1b71d41dc9b58d5bfb411bc89ae2d45b6f3f778152714bfd1afeab0bef2f33

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt

operations:
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzCodecsRejectMalformedPersistedDataWithoutPanicking$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzScopeIdentifiers$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzImportDocumentsFailClosed$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzResolutionOfMalformedStoredValues$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzRestoreSnapshotFailsClosed$'
        budget: 2s
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [".", "./memory", "./valkey"]
        benchmark: "."
        budget: 100x
        timeout: 20m
