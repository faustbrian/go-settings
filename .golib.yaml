schema_version: 1
tool_version: v1.0.5
tool_checksums_sha256: 7ee6c6c9bccd76cc1071fb891073055d393701abaed047e0357370f128ba771b

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt

operations:
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzCodecsRejectMalformedPersistedDataWithoutPanicking$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzScopeIdentifiers$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzImportDocumentsFailClosed$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzResolutionOfMalformedStoredValues$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzRestoreSnapshotFailsClosed$'
        budget: 2s
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [".", "./memory", "./valkey"]
        benchmark: "."
        budget: 100x
        timeout: 20m
