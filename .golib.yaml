schema_version: 1
tool_version: v2.1.3
tool_checksums_sha256: 59e2a0882ddfc7a1b2acd64b1d1ed51d40e325f9a0e4cec11cac41a4ce92c888

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/v3.txt

operations:
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: ["."]
        run: '^Test(ConcurrentRegistriesReadsWritesAndSnapshots|SnapshotRemainsStableAcrossConcurrentWrites|RuntimeCoordinatesConcurrentStartupAndShutdown|RuntimeCloseWaitsForStartupThenShutsDown|RuntimeShutdownWaitsForStartupThenShutsDown)$'
        race: true
        count: 1
        timeout: 2m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzCodecsRejectMalformedPersistedDataWithoutPanicking$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzScopeIdentifiers$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzImportDocumentsFailClosed$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzResolutionOfMalformedStoredValues$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzRestoreSnapshotFailsClosed$'
        budget: 2s
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [".", "./memory", "./valkey"]
        benchmark: "."
        budget: 100x
        timeout: 20m
